[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "motec-dash"
version = "0.3.0"
description = "Leitor não oficial de logs .ld do painel MoTeC C1212"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyarrow>=15", "ruamel.yaml>=0.18"]

[project.optional-dependencies]
testes = ["pytest>=8"]

[tool.setuptools]
packages = ["motec_dash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
